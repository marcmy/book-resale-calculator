name: Update Electron 43

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-and-verify:
    if: github.head_ref == 'agent/update-electron-43'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/update-electron-43

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Update Electron and lockfile
        run: npm install --save-dev electron@43.2.0

      - name: Verify clean install
        run: npm ci

      - name: Run calculator checks
        run: npm run check

      - name: Build Windows installer
        run: npm run build:win -- --publish never

      - name: Commit dependency update
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Update Electron to 43.2.0"
            git push origin HEAD:agent/update-electron-43
          }
